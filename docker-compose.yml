services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: temporal
    ports:
      - "3307:3306"

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      - mysql
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_USER: root
      MYSQL_PWD: root
      MYSQL_SEEDS: mysql